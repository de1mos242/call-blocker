name: Build Android APK

on:
  push:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: write
  packages: write

concurrency:
  group: android-apk
  cancel-in-progress: true

jobs:
  build:
    name: Build development APK
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Set up Java
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@0723195856401067f7a2779048b490ace7a47d7c # v5.0.2

      - name: Install Android SDK packages
        run: sdkmanager "platforms;android-37" "build-tools;36.0.0"

      - name: Build Android APK
        run: |
          ./gradlew --no-daemon lintDebug testDebugUnitTest assembleDebug
          install -Dm644 app/build/outputs/apk/debug/app-debug.apk Builds/Android/CallBlocker.apk

      - name: Upload APK as workflow artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: CallBlocker-Android-${{ github.sha }}
          path: Builds/Android/CallBlocker.apk
          if-no-files-found: error
          retention-days: 14

      - name: Publish APK to GitHub Packages
        env:
          GH_TOKEN: ${{ github.token }}
          PACKAGE_TAG: ${{ github.run_number }}.${{ github.run_attempt }}
        run: |
          package="ghcr.io/${GITHUB_REPOSITORY,,}/android-apk"
          docker login ghcr.io --username "${{ github.actor }}" --password-stdin <<< "$GH_TOKEN"
          cat > Dockerfile.apk <<'DOCKERFILE'
          FROM scratch
          COPY Builds/Android/CallBlocker.apk /CallBlocker.apk
          LABEL org.opencontainers.image.title="Call Blocker Android APK"
          LABEL org.opencontainers.image.description="Development Android APK built from master."
          DOCKERFILE
          docker build \
            --label "org.opencontainers.image.revision=${{ github.sha }}" \
            --label "org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}" \
            --tag "$package:$PACKAGE_TAG" \
            --tag "$package:latest" \
            --file Dockerfile.apk .
          docker push "$package:$PACKAGE_TAG"
          docker push "$package:latest"

      - name: Publish APK to GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: android-${{ github.run_number }}.${{ github.run_attempt }}
          RELEASE_TITLE: Android APK ${{ github.run_number }}.${{ github.run_attempt }}
        run: |
          gh release create "$RELEASE_TAG" Builds/Android/CallBlocker.apk \
            --title "$RELEASE_TITLE" \
            --notes "Development Android APK built from ${{ github.sha }} on master." \
            --target "${{ github.sha }}" \
            --latest
